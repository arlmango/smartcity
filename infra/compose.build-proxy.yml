# Optional override for building images behind a TLS-intercepting egress proxy (e.g. sandboxed CI).
# Usage: BUILD_CA_BUNDLE=/path/ca.crt docker compose -f docker-compose.yml -f infra/compose.build-proxy.yml build
services:
  api:
    build:
      network: host
      args:
        HTTPS_PROXY: ${HTTPS_PROXY:-}
      secrets: [build_ca]
  web:
    build:
      network: host
      args:
        HTTPS_PROXY: ${HTTPS_PROXY:-}
      secrets: [build_ca]
secrets:
  build_ca:
    file: ${BUILD_CA_BUNDLE:-/dev/null}
