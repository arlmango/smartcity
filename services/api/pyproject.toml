[project]
name = "smartcity-api"
version = "0.1.0"
description = "SmartCity API: grounded walk recommendations for Astana (FastAPI)."
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.146.0",
  "starlette==1.9.0",
  "uvicorn[standard]==0.38.0",
  "pydantic==2.12.3",
  "pydantic-settings==2.11.0",
  "sqlalchemy==2.0.44",
  "alembic==1.17.0",
  "psycopg[binary]==3.2.11",
  "geoalchemy2==0.18.0",
  "pgvector==0.4.1",
  "shapely==2.1.2",
  "httpx==0.28.1",
  "opening-hours-py==2.1.4",
  "tzdata==2025.2",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["smartcity_api"]
