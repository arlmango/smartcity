[project]
name = "smartcity-workspace"
version = "0.1.0"
requires-python = ">=3.12,<3.14"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["services/api", "services/ingest"]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.14.1",
  "mypy==1.18.2",
  "respx==0.22.0",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101", "S311", "B008"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S", "E501"]
"scripts/**" = ["S603", "S607"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
